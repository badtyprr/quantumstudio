name: Native CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Deduplicate PR updates; delayed pushes must not cancel a different release SHA.
  group: native-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential autoconf automake libtool gettext autopoint intltool \
            python3 pkg-config libgmp-dev libmpfr-dev libxml2-dev libreadline-dev
      - name: Check integer arithmetic for undefined behavior
        run: |
          g++ -std=c++17 -O1 -fsanitize=undefined -fno-sanitize-recover=undefined -I. \
            src/quantum-classical-range-test.cc libqalculate/QuantumClassicalInteger.cc \
            libqalculate/QuantumClassicalRange.cc -o /tmp/quantum-range-sanitizer
          /tmp/quantum-range-sanitizer
          g++ -std=c++17 -O1 -fsanitize=undefined -fno-sanitize-recover=undefined -I. \
            src/quantum-classical-integer-test.cc libqalculate/QuantumClassicalInteger.cc \
            -o /tmp/quantum-integer-sanitizer
          /tmp/quantum-integer-sanitizer
          g++ -std=c++17 -O1 -fsanitize=undefined -fno-sanitize-recover=undefined -I. \
            src/quantum-classical-integer-type-test.cc libqalculate/QuantumClassicalInteger.cc \
            libqalculate/QuantumClassicalIntegerType.cc -o /tmp/quantum-integer-type-sanitizer
          /tmp/quantum-integer-type-sanitizer
          g++ -std=c++17 -O1 -fsanitize=undefined -fno-sanitize-recover=undefined -I. \
            src/quantum-classical-integer-expression-test.cc libqalculate/QuantumClassicalInteger.cc \
            libqalculate/QuantumClassicalIntegerType.cc libqalculate/QuantumClassicalIntegerStorage.cc \
            libqalculate/QuantumClassicalIntegerExpression.cc libqalculate/QuantumClassical.cc \
            libqalculate/QuantumClassicalRealExpression.cc libqalculate/QuantumClassicalNumeric.cc \
            libqalculate/QuantumClassicalArray.cc \
            -lgmp -o /tmp/quantum-integer-expression-sanitizer
          /tmp/quantum-integer-expression-sanitizer
      - name: Configure
        run: |
          autoreconf -fi
          ./configure --disable-shared --enable-static \
            --without-libcurl --without-icu --disable-nls
      - name: Compile
        run: make -j2
      - name: Run native tests
        # Build test executables and run isolated test processes on both workers.
        run: make -j2 check
      - name: Verify source distribution
        run: |
          make dist-gzip
          python3 windows/test-source-dist.py libqalculate-*.tar.gz
      - name: Show test diagnostics
        if: always()
        run: |
          if test -f src/test-suite.log; then cat src/test-suite.log; fi
