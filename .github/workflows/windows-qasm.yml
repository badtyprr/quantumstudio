name: Windows OpenQASM CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  # Deduplicate PR updates; delayed pushes must not cancel a different release SHA.
  group: windows-qasm-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  compiler:
    name: Windows OpenQASM build and tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Install compiler dependencies
        shell: powershell
        run: |
          python -m venv .tools/qasm-venv
          if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed.' }
          & .tools/qasm-venv/Scripts/python.exe -m pip install -r windows/qasm-import-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Compiler dependency installation failed.' }
          & .tools/qasm-venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Compiler dependencies are inconsistent.' }
      - name: Validate local source bundles
        shell: powershell
        run: |
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-source-bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenQASM source bundle tests failed.' }
      - name: Build and validate packaged compiler
        shell: powershell
        run: |
          & windows/build-qasm-import.ps1
          & windows/test-source-import-bridge.ps1
          & windows/build-gui.ps1
          & .tools/qasm-venv/Scripts/python.exe windows/test-classical-module-export.py
          if ($LASTEXITCODE -ne 0) { throw 'Classical module export validation failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-classical-export-ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Classical export GUI validation failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-composer-source-import.py
          if ($LASTEXITCODE -ne 0) { throw 'Composer source import tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-source-files-ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Source check/reimport GUI tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-file-import.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe
          if ($LASTEXITCODE -ne 0) { throw 'OpenQASM file import tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-protocol.py
          if ($LASTEXITCODE -ne 0) { throw 'OpenQASM protocol tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-classical-expressions.py
          if ($LASTEXITCODE -ne 0) { throw 'Classical expression import tests failed.' }
          & windows/build-runtime-angle-import-test.ps1
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-runtime-angles.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Runtime angle import tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-runtime-gates.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Runtime gate import tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-runtime-numeric.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Runtime numeric import tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-runtime-numeric-calls.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Runtime numeric subroutine tests failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-dev08-numeric-source.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Numeric subroutine source evidence failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-qasm-runtime-wires.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Runtime wire import checks failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-dev07-source-evidence.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'DEV-07 pinned source evidence failed.' }
          & .tools/qasm-venv/Scripts/python.exe windows/test-dev06-source-evidence.py --frozen dist/QuantumStudio/qasm-import/qasm-import.exe --adapter dist/gui-validation/runtime-angle-import-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'DEV-06 pinned source evidence failed.' }
          $expressionCases = Join-Path $env:RUNNER_TEMP 'expression-qasm-cases.json'
          & windows/test-classical-expression-qasm.ps1 -CasesPath $expressionCases
          & .tools/qasm-venv/Scripts/python.exe windows/test-classical-expression-qasm.py --cases $expressionCases
          if ($LASTEXITCODE -ne 0) { throw 'Typed OpenQASM expression tests failed.' }
          $storageCases = Join-Path $env:RUNNER_TEMP 'storage-qasm-cases.json'
          & windows/test-classical-storage-qasm.ps1 -CasesPath $storageCases
          & .tools/qasm-venv/Scripts/python.exe windows/test-classical-expression-qasm.py --cases $storageCases --expected-cases 12
          if ($LASTEXITCODE -ne 0) { throw 'OpenQASM storage tests failed.' }
          $programCases = Join-Path $env:RUNNER_TEMP 'program-qasm-cases.json'
          & windows/test-classical-program-qasm.ps1 -CasesPath $programCases
          & .tools/qasm-venv/Scripts/python.exe windows/test-classical-expression-qasm.py --cases $programCases --expected-cases 35
          if ($LASTEXITCODE -ne 0) { throw 'OpenQASM program tests failed.' }
