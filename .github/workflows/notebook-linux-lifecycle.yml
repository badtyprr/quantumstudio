name: Notebook Linux retained-environment lifecycle acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/notebook-linux-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: notebook-linux-lifecycle
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product
    env:
      LIFECYCLE_PRODUCT: 1106694711cd56b89e21495334fee060b00ebc51
      LIFECYCLE_HARNESS: ${{ github.event.pull_request.head.sha || github.sha }}
      LIFECYCLE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      LIFECYCLE_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Check out immutable product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 1106694711cd56b89e21495334fee060b00ebc51
          path: product
      - name: Check out exact proposed harness for identity only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
      - name: Set up fixed Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Bind source, harness and guest identity
        shell: python
        run: |
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'notebook-linux-lifecycle'
          root.mkdir(exist_ok=False)
          def git(directory, *args):
              return subprocess.check_output(['git', '-C', str(directory), *args], text=True).strip()
          product = Path.cwd()
          harness = Path(os.environ['GITHUB_WORKSPACE']) / 'harness'
          assert git(product, 'rev-parse', 'HEAD') == os.environ['LIFECYCLE_PRODUCT']
          assert git(harness, 'rev-parse', 'HEAD') == os.environ['LIFECYCLE_HARNESS']
          assert not git(product, 'status', '--porcelain', '--untracked-files=all')
          assert sys.version_info[:3] == (3, 12, 10) and sys.platform == 'linux' and platform.machine() == 'x86_64'
          paths = ['run.py', 'execution.py', 'linux_lifecycle.py', 'test_execution.py', 'test_linux_execution.py',
                   'profiles/notebook-linux-py312.json', 'linux-notebook-requirements.lock']
          hashes = {p: hashlib.sha256((product / 'windows/dev13-notebooks' / p).read_bytes()).hexdigest() for p in paths}
          workflow = harness / '.github/workflows/notebook-linux-lifecycle.yml'
          record = dict(product_revision=os.environ['LIFECYCLE_PRODUCT'], product_tree=git(product, 'rev-parse', 'HEAD^{tree}'),
                        harness_revision=os.environ['LIFECYCLE_HARNESS'], workflow_sha=os.environ['LIFECYCLE_WORKFLOW_SHA'],
                        workflow_ref=os.environ['LIFECYCLE_WORKFLOW_REF'], harness_workflow_sha256=hashlib.sha256(workflow.read_bytes()).hexdigest(),
                        event_revision=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                        source_hashes=hashes, python=sys.version, platform=platform.platform(), machine=platform.machine(),
                        image_os=os.environ.get('ImageOS'), image_version=os.environ.get('ImageVersion'),
                        scope='Authored fixture containment only; no original framework notebook or CUDA-Q acceptance.')
          (root / 'identity.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
          (root / 'harness-workflow.yml').write_bytes(workflow.read_bytes())
      - name: Require actual service capability before artifact acquisition
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/notebook-linux-lifecycle"
          python -B -E -s windows/dev13-notebooks/test_linux_execution.py --preflight --output "$root/preflight" 2>&1 | tee "$root/preflight.log"
      - name: Acquire only the retained verified bootstrap artifact
        shell: python
        env:
          ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, stat, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP']) / 'notebook-linux-lifecycle'
          expected_digest = '56070077ff4f05db60ff3ce5681d53dc65162d3f75ff2f8bd3572c8730b5ad9b'
          api = 'https://api.github.com/repos/badtyprr/quantumstudio/actions/artifacts/13343839049'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          headers = {'Authorization': 'Bearer ' + os.environ['ARTIFACT_TOKEN'], 'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          try:
              with opener.open(urllib.request.Request(api, headers=headers), timeout=30) as response:
                  raw = response.read(1024 * 1024 + 1)
              assert len(raw) <= 1024 * 1024
              metadata = json.loads(raw)
              assert metadata['id'] == 13343839049 and metadata['expired'] is False
              assert metadata['digest'] == 'sha256:' + expected_digest
              assert metadata['workflow_run']['id'] == 41872076629
              assert metadata['workflow_run']['head_sha'] == 'bfe2c8944e329a3b47157593b3601103d3a4a879'
              assert metadata['size_in_bytes'] == 55696731
              (root / 'artifact-api.json').write_bytes(raw)
              try:
                  opener.open(urllib.request.Request(api + '/zip', headers=headers), timeout=30)
                  raise RuntimeError('Expected artifact redirect')
              except urllib.error.HTTPError as redirect:
                  assert redirect.code == 302
                  location = redirect.headers['Location']
              parsed = urllib.parse.urlsplit(location)
              assert parsed.scheme == 'https' and parsed.hostname and not parsed.username and not parsed.password
              # Never forward the GitHub token to artifact storage; never log the signed URL.
              storage = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              archive = root / 'dependency-artifact.zip'
              with storage.open(location, timeout=60) as response, archive.open('xb') as out:
                  total = 0
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      assert total <= metadata['size_in_bytes']
                      out.write(chunk)
              assert archive.stat().st_size == metadata['size_in_bytes']
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected_digest
          except Exception as error:
              (root / 'acquisition-failure.json').write_text(json.dumps({'stage':'retained-artifact-acquisition', 'error_type':type(error).__name__}), encoding='utf-8')
              raise SystemExit('Retained artifact acquisition failed; no token or signed URL logged') from None
          extracted = root / 'retained'
          extracted.mkdir(exist_ok=False)
          with zipfile.ZipFile(archive) as package:
              seen = set()
              assert sum(entry.file_size for entry in package.infolist()) <= 256 * 1024 * 1024
              for entry in package.infolist():
                  parts = PurePosixPath(entry.filename).parts
                  assert parts and not PurePosixPath(entry.filename).is_absolute()
                  assert '\\' not in entry.filename and ':' not in entry.filename and all(p not in ('.','..') for p in parts)
                  assert entry.filename.rstrip('/') == '/'.join(parts)
                  assert entry.filename not in seen
                  seen.add(entry.filename)
                  assert stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR)
                  assert not (entry.flag_bits & 1)
                  destination = extracted.joinpath(*parts).resolve()
                  assert destination.is_relative_to(extracted.resolve()) and destination != extracted.resolve()
              package.extractall(extracted)
          manifest = json.loads((extracted / 'evidence-manifest.json').read_bytes())
          assert len(manifest) == 121
          actual = {p.relative_to(extracted).as_posix() for p in extracted.rglob('*') if p.is_file()}
          assert actual == set(manifest) | {'evidence-manifest.json'}
          assert not any('environment' in PurePosixPath(p).parts for p in actual)
          for name, record in manifest.items():
              path = extracted / name
              assert path.stat().st_size == record['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest() == record['sha256']
          identity = json.loads((extracted / 'identity.json').read_bytes())
          assert identity['source_revision'] == 'bfe2c8944e329a3b47157593b3601103d3a4a879'
          assert identity['run_id'] == '41872076629' and identity['attempt'] == '1'
          bootstrap = extracted / 'bootstrap'
          profile = json.loads(Path('windows/dev13-notebooks/profiles/notebook-linux-py312.json').read_bytes())
          lock = Path('windows/dev13-notebooks') / profile['lock']
          assert lock.read_bytes() == (bootstrap / 'requirements.lock').read_bytes()
          assert hashlib.sha256(lock.read_bytes()).hexdigest() == profile['lock_sha256'] == '18848dd56acfa26d5a107454eeb30fb38c1388f3eff532254fed9d2b11eba4c4'
          wheels = json.loads((bootstrap / 'wheel-manifest.json').read_bytes())
          assert len(wheels) == 46 and {p.name for p in (bootstrap / 'wheels').iterdir()} == {p['filename'] for p in wheels}
          for record in wheels:
              path = bootstrap / 'wheels' / record['filename']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == record['sha256'] and path.stat().st_size == record['bytes']
          (root / 'artifact-verification.json').write_text(json.dumps(dict(passed=True, artifact_id=13343839049, run_id=41872076629,
              sha256=expected_digest, manifest_files=121, wheels=46, lock_sha256=profile['lock_sha256'], fresh_resolution=False), indent=2), encoding='utf-8')
      - name: Install retained wheels offline through the public environment command
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/notebook-linux-lifecycle"
          python -B -E -s windows/dev13-notebooks/run.py environment --profile notebook-linux-py312 --python "$(command -v python)" --wheelhouse "$root/retained/bootstrap/wheels" --destination "$RUNNER_TEMP/notebook-linux-lifecycle-environment" 2>&1 | tee "$root/environment-command.log"
      - name: Execute fourteen actual Linux lifecycle fixture cases
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/notebook-linux-lifecycle"
          "$RUNNER_TEMP/notebook-linux-lifecycle-environment/bin/python" -B -E -s windows/dev13-notebooks/test_linux_execution.py --suite --output "$root/suite" 2>&1 | tee "$root/suite.log"
      - name: Require every case and preserve the finite acceptance boundary
        shell: python
        run: |
          import ast, hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'notebook-linux-lifecycle'
          source = Path('windows/dev13-notebooks/test_linux_execution.py').read_text()
          tree = ast.parse(source)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'LinuxLifecycleTests')
          expected = {n.name for n in cls.body if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')}
          assert len(expected) == 14
          text = (root / 'suite.log').read_text()
          passed = re.findall(r'^(test_[A-Za-z0-9_]+) \(__main__\.LinuxLifecycleTests\.\1\) \.\.\. ok$', text, re.MULTILINE)
          assert len(passed) == 14 and set(passed) == expected
          assert re.search(r'^Ran 14 tests in [0-9.]+s$', text, re.MULTILINE)
          assert re.search(r'^OK$', text, re.MULTILINE) and not re.search(r'\b(?:skipped|FAILED|ERROR|FAIL)\b', text)
          assert {p.name for p in (root / 'suite').iterdir() if p.is_dir()} == {n + ' space-λ' for n in expected}
          environment = Path(os.environ['RUNNER_TEMP']) / 'notebook-linux-lifecycle-environment'
          report = json.loads((environment / 'environment.json').read_bytes())
          assert report['state'] == 'succeeded' and report['offline_only'] is True
          assert len(report['identity']['packages']) == 46
          before = json.loads((root / 'identity.json').read_bytes())
          for name, digest in before['source_hashes'].items():
              assert hashlib.sha256((Path('windows/dev13-notebooks') / name).read_bytes()).hexdigest() == digest
          (root / 'acceptance.json').write_text(json.dumps(dict(passed=True, product_revision=before['product_revision'],
              cases=14, skips=0, fixtures=sorted(expected), environment_packages=46,
              scope='Authored Linux containment fixtures only; no original framework notebook, CUDA-Q, provider or release acceptance.'), indent=2), encoding='utf-8')
      - name: Retain available environment logs and hash evidence on success or failure
        if: always()
        shell: python
        run: |
          import hashlib, json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'notebook-linux-lifecycle'
          root.mkdir(exist_ok=True)
          environment = Path(os.environ['RUNNER_TEMP']) / 'notebook-linux-lifecycle-environment'
          for name in ('environment.json','install.log'):
              if (environment / name).is_file():
                  shutil.copyfile(environment / name, root / ('offline-' + name))
          records = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and not path.is_symlink() and path != root / 'evidence-manifest.json':
                  records[path.relative_to(root).as_posix()] = dict(bytes=path.stat().st_size, sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          (root / 'evidence-manifest.json').write_text(json.dumps(records, indent=2), encoding='utf-8')
      - name: Retain actual fixture outputs even on failure without installed environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notebook-linux-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notebook-linux-lifecycle
          if-no-files-found: error
          retention-days: 30
